<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đèn giao thông</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px 40px;
            background: #fff;
            color: #222;
            font-family: Arial, sans-serif;
        }

        .traffic-light-app {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 48px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .controls button {
            padding: 5px 13px;
            border: 2px solid #aaa;
            border-radius: 4px;
            background: #f8f8f8;
            color: #222;
            font-size: 20px;
            cursor: pointer;
        }

        .controls button:hover {
            background: #e9e9e9;
        }

        .controls button:focus-visible {
            outline: 3px solid #3578d4;
            outline-offset: 3px;
        }

        .signal {
            position: relative;
            width: 210px;
            padding: 10px;
            border: 9px solid #111;
            border-radius: 8px;
            background: linear-gradient(90deg, #111 0%, #292929 10%, #171717 90%, #555 100%);
            box-shadow: 8px 0 0 #777, -8px 0 0 #050505, 0 8px 12px #0005;
        }

        .signal::before {
            position: absolute;
            z-index: -1;
            top: -54px;
            left: 42px;
            width: 110px;
            height: 50px;
            border-radius: 60% 60% 0 0;
            background: linear-gradient(110deg, #050505 20%, #555 75%, #111);
            content: "";
        }

        .lamp {
            position: relative;
            display: grid;
            width: 100%;
            height: 178px;
            place-items: center;
            border: 5px solid #080808;
            background: linear-gradient(90deg, #111, #292929 12%, #202020 88%, #111);
        }

        .lamp + .lamp {
            border-top-width: 4px;
        }

        .lamp::before,
        .lamp::after {
            position: absolute;
            z-index: -1;
            top: 15px;
            width: 85px;
            height: 138px;
            background: linear-gradient(100deg, #555, #202020 70%, #080808);
            content: "";
        }

        .lamp::before {
            right: calc(100% + 4px);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 86% 100%, 85% 81%, 66% 67%, 36% 51%, 15% 35%, 0 18%);
        }

        .lamp::after {
            left: calc(100% + 4px);
            transform: scaleX(-1);
            clip-path: polygon(0 0, 100% 0, 100% 18%, 85% 35%, 64% 51%, 34% 67%, 15% 81%, 14% 100%, 0 100%);
        }

        .bulb {
            width: 132px;
            height: 132px;
            border: 5px solid #080808;
            border-radius: 50%;
            box-shadow: inset 0 0 0 3px #333, inset -8px -12px 18px #0009;
            filter: brightness(.3);
            transition: filter .2s ease, box-shadow .2s ease;
        }

        .bulb.red {
            background: radial-gradient(circle at 66% 30%, #bd4a42, #a00000 52%, #580000);
        }

        .bulb.yellow {
            background: radial-gradient(circle at 66% 30%, #fff69b, #ffd500 50%, #ad8500);
        }

        .bulb.green {
            background: radial-gradient(circle at 66% 30%, #369c56, #00852b 52%, #004819);
        }

        .bulb.active {
            filter: brightness(1);
            box-shadow: inset -8px -12px 18px #0005, 0 0 12px 3px currentColor;
        }

        .bulb.red.active {
            color: #f22;
        }

        .bulb.yellow.active {
            color: #ffd500;
        }

        .bulb.green.active {
            color: #00a83b;
        }

        @media (max-width: 380px) {
            .traffic-light-app {
                gap: 42px;
            }

            .signal {
                width: 190px;
            }

            .lamp {
                height: 160px;
            }

            .bulb {
                width: 118px;
                height: 118px;
            }
        }
    </style>
</head>
<body>
    <main class="traffic-light-app">
        <div class="controls" aria-label="Chọn màu đèn">
            <button type="button" data-color="green" aria-pressed="false">green</button>
            <button type="button" data-color="yellow" aria-pressed="false">yellow</button>
            <button type="button" data-color="red" aria-pressed="true">red</button>
        </div>

        <div class="signal" role="img" aria-label="Đèn giao thông, màu đỏ đang bật">
            <div class="lamp"><div class="bulb red active" data-lamp="red"></div></div>
            <div class="lamp"><div class="bulb yellow" data-lamp="yellow"></div></div>
            <div class="lamp"><div class="bulb green" data-lamp="green"></div></div>
        </div>
    </main>

    <script src="dengt.js" defer></script>
</body>
</html>
