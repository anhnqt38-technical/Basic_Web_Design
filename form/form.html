<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<body>
    <form action="" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name">
        <br>
        <label for="email">Email</label>
        <input type="email" id="email" name="name">
        <br>

        <input type="radio" name="Gender" id="Male" value="Female">
        <label for="Female">Female</label>
        <input type="radio" name="Gender" id="Male" value="Male">
        <label for="Male">Female</label>

        <br>
        <select for="message" name="Gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        <br>

        <label for="favorite">Favorite</label>
        <input type="checkbox" name="favorite" id="reading">
        <label for="favorite">Reading</label>
        <input type="checkbox" name="favorite" id="swimming">
        <label for="favorite">Swimming</label>

        <br>
        <label for="country">Country</label>
        <select name="country" id="country">
            <option value="usa">USA</option>
            <option value="Canada">Canada</option>
            <option value="UK">UK</option>
        </select>
        <br>

        <label for="comments">Comment: </label>
        <br>
        <textarea name="comments" id="comments" rows="4" column="50"></textarea>
        <br>
        <input type="submit" value="Submit">
    </form>

</body>
</html>
