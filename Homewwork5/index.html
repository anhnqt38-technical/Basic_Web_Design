<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Product</title>
    <link rel="stylesheet" href="style..css">
    <script src=product.js></script>
</head>
<body>
    <div class="page">
        <header class="header">
            <div>
                <h1 class="title">New Product</h1>
            </div>
        </header>

        <form class="product-form" name="frm">
            <div class="input-row">
                <div class="field">
                    <label for="pro-name">Product Name</label>
                    <input type="text" name="pname" id="pro-name" placeholder="Quần âu">
                </div>

                <div class="field">
                    <label for="quantity">Quantity</label>
                    <input type="number" name="qty" id="quantity" placeholder="20">
                </div>
            </div>

            <div class="input-row">
                <div class="field">
                    <label for="price">Price</label>
                    <input type="number" name="price" id="price" placeholder="400000">
                </div>

                <div class="field">
                    <label for="discount">Discount</label>
                    <input type="number" name="dc" id="discount" placeholder="10">
                </div>
            </div>

            <div class="button-row">
                <button class="sell" onclick="sell()" type="button">Sell</button>
                <button class="cancel" type="button">Cancel</button>
            </div>
        </form>

        <div class="table-wrapper">
            <table class="table" id="tbl">
                    <tr>
                        <th>ID</th>
                        <th>Product Name</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Discount</th>
                        <th>Subtotal</th>
                    </tr>

            </table>

        </div>

    </div>
</body>
</html>
